# Aplica las migraciones pendientes de Prisma a la base de datos de producción.
# Solo se ejecuta a mano (Actions → "Migrar base de datos" → Run workflow), nunca en el build de Vercel.
# Requiere el secreto DATABASE_URL en Settings → Secrets and variables → Actions.
name: Migrar base de datos

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar las migraciones (false = solo ver el estado)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrar:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Estado de las migraciones
        run: pnpm exec prisma migrate status || true
      - name: Aplicar migraciones pendientes
        if: ${{ inputs.aplicar }}
        run: pnpm exec prisma migrate deploy
